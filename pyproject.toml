[project]
name = "google-draft-managed-agents"
version = "0.1.0"
description = "Policy-controlled Google Cloud managed agent platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
	"fastapi>=0.115,<1",
	"uvicorn[standard]>=0.34,<1",
	"httpx>=0.28,<1",
	"pydantic>=2.10,<3",
	"PyJWT[crypto]>=2.10,<3",
	"google-auth[requests]>=2.38,<3",
	"pyyaml>=6,<7",
]

[project.optional-dependencies]
agent-engine = ["google-cloud-aiplatform[agent_engines,adk]>=1.130,<2"]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
